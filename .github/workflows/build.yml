name: Build Sycord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Web Extension
        run: pnpm buildWeb

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sycord-dist
          path: |
            dist/main.js
            dist/preload.js
            dist/renderer.js
            dist/sycord-extension.zip
